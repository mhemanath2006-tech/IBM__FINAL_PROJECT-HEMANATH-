{% extends "base.html" %}{% block title %}Change password{% endblock %}
{% block content %}
<div class="card" style="max-width:420px"><h1>Change password</h1>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>Current password</label><input type="password" name="current" required>
<label>New password (6+ characters)</label><input type="password" name="new" minlength="6" required>
<p><button>Save</button></p></form></div>
{% endblock %}
